<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SheetLens - Advanced Spreadsheet Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            overflow: hidden;
            margin: 0;
        }
        /* Spreadsheet Scrollbar */
        ::-webkit-scrollbar {
            width: 12px;
            height: 12px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-left: 1px solid #e5e7eb;
            border-top: 1px solid #e5e7eb;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border: 2px solid #f1f1f1;
            border-radius: 6px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Sheets UI Specifics */
        .grid-header {
            background-color: #f8f9fa;
            color: #5f6368;
            font-size: 11px;
            font-weight: 500;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 1px solid #d1d5db;
            border-bottom: 1px solid #d1d5db;
        }
        .grid-header.active {
            background-color: #e8eaed;
            color: #1a73e8;
        }

        .cell-active {
            outline: 2px solid #1a73e8;
            outline-offset: -2px;
            z-index: 10;
        }
        .cell-in-range {
            background-color: rgba(26, 115, 232, 0.08);
        }
        
        /* Hide scrollbar for tabs */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "xlsx": "https://esm.sh/xlsx@0.18.5",
    "react": "https://esm.sh/react@18.3.1",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "lucide-react": "https://esm.sh/lucide-react@0.454.0",
    "recharts": "https://esm.sh/recharts@2.12.0",
    "react/": "https://esm.sh/react@18.3.1/",
    "react-dom/": "https://esm.sh/react-dom@18.3.1/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.4"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
</body>
</html>
